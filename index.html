<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiosk POS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Kiosk POS</title>
<style>
html{color-scheme:light dark;font-size:16px}
[hidden]{display:none!important}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* Layout: one-screen register. Item grid on the left, running order on the right; Stock, Daily Report and Items are separate tabs. */
:root{--bg:#eef1f0;--card:#ffffff;--ink:#1b2321;--mute:#5d6b67;--line:#d9dfdd;--accent:#1f6f5c;--accent2:#dcefe9;--on-accent:#ffffff;--ok:#1d7a46;--bad:#b42318;--badbg:#fde8e6;--field:#ffffff;--scrim:rgba(10,20,17,.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2220;--ink:#e8eeec;--mute:#93a39e;--line:#2d3836;--accent:#4fb99d;--accent2:#1f3a33;--on-accent:#0b1512;--ok:#5fd08f;--bad:#ff8a7a;--badbg:#3a1f1c;--field:#151b19;--scrim:rgba(0,0,0,.65);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2220;--ink:#e8eeec;--mute:#93a39e;--line:#2d3836;--accent:#4fb99d;--accent2:#1f3a33;--on-accent:#0b1512;--ok:#5fd08f;--bad:#ff8a7a;--badbg:#3a1f1c;--field:#151b19;--scrim:rgba(0,0,0,.65);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:1rem;-webkit-user-select:none;user-select:none}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{-webkit-user-select:text;user-select:text;background:var(--field);border:1px solid var(--line);border-radius:0.625rem;padding:0.6875rem;font-size:1rem}
input[type=checkbox]{width:1.375rem;height:1.375rem;padding:0;accent-color:var(--accent);flex-shrink:0}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:0.75rem;padding:0.625rem 1rem;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:1.125rem;margin:0;flex:1;min-width:7.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home{padding:1.5rem 0}.home h2{margin:0 0 1rem;font-size:1.375rem;text-align:center}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.hbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.5rem;min-height:12rem;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:1.25rem;padding:1.25rem;text-align:center}
.hbtn:active{background:var(--accent2)}.hbtn .ico{font-size:3rem;line-height:1}.hbtn b{font-size:1.5rem}.hbtn small{color:var(--mute);font-size:0.9375rem}
.hbtn .cnt{position:absolute;top:0.75rem;right:0.75rem;background:var(--accent);color:var(--on-accent);border-radius:62.4375rem;min-width:1.75rem;padding:0.125rem 0.5rem;font-weight:700;font-size:1rem}
.tabbar{display:flex;align-items:center;gap:0.5rem;padding:0.5rem 1rem;background:var(--accent2);color:var(--accent);font-weight:700;border-bottom:1px solid var(--line);flex-shrink:0}
.tabbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tabbar[hidden]{display:none}
.ccard{display:flex;align-items:center;gap:0.75rem;padding:0.875rem;border:1px solid var(--line);border-radius:0.875rem;background:var(--card);margin-bottom:0.625rem}
.ccard .n{flex:1;min-width:0}.ccard .n b{font-size:1.125rem}.ccard .n small{display:block;color:var(--mute)}.ccard .amt{text-align:right;font-weight:700}.ccard .amt small{display:block;color:var(--accent);font-weight:600}
.phrow{display:flex;align-items:center;gap:0.625rem;flex-wrap:wrap}.phimg{width:4.5rem;height:4.5rem;border-radius:0.625rem;object-fit:cover;background:var(--accent2);border:1px solid var(--line)}.chkrow{display:flex;align-items:center;gap:0.625rem;font-weight:600}.chkrow input{width:1.5rem;height:1.5rem;flex:none}.tagm{font-size:0.75rem;color:var(--mute);font-weight:400}
.nav{display:flex;gap:0.25rem}
.nav button{border:0;background:transparent;padding:0.625rem 1rem;border-radius:0.625rem;font-weight:600;color:var(--mute);font-size:1rem}
.nav button.on{background:var(--accent);color:var(--on-accent)}
main{flex:1;min-height:0;overflow:hidden}
.view{display:none;height:100%}
.view.on{display:block}
#v-sale.on{display:flex}
.left{flex:1;min-width:0;display:flex;flex-direction:column}
.cats{display:flex;gap:0.5rem;padding:0.75rem 1rem;overflow-x:auto;flex-shrink:0}
.cats button{border:1px solid var(--line);background:var(--card);padding:0.75rem 1.25rem;border-radius:62.4375rem;font-weight:600;font-size:1rem;white-space:nowrap}
.cats button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.grid{flex:1;overflow-y:auto;padding:0.25rem 1rem 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(9.375rem,1fr));gap:0.75rem;align-content:start}
.tile{background:var(--card);border:1px solid var(--line);border-radius:0.875rem;padding:0.875rem;min-height:6.5rem;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:0.5rem;position:relative}
.tile:active{background:var(--accent2)}
.tile b{font-size:1rem;line-height:1.2;padding-right:1.375rem;display:block}
.tile span{color:var(--accent);font-weight:700;font-size:1.0625rem}
.tile small{display:block;color:var(--mute);font-size:0.75rem;margin-top:0.125rem}
.tile .badge{position:absolute;top:0.5rem;right:0.5rem;background:var(--accent);color:var(--on-accent);border-radius:62.4375rem;min-width:1.5rem;height:1.5rem;line-height:1.5rem;text-align:center;font-size:0.8125rem;font-weight:700;padding:0 0.375rem}
.stk{display:block;color:var(--mute);font-size:0.75rem;margin-top:0.1875rem}
.stk.out{color:var(--bad);font-weight:700}
.empty{color:var(--mute);padding:1.875rem 1rem;grid-column:1/-1}
.cart{width:21.875rem;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart h2{margin:0;padding:0.75rem 1rem;font-size:1.0625rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:0.5rem}
.cart h2 .hb{display:flex;gap:0.375rem}
.lines{flex:1;overflow-y:auto;padding:0.375rem 0.75rem;min-height:0}
.line{display:flex;align-items:center;gap:0.5rem;padding:0.625rem 0.25rem;border-bottom:1px solid var(--line)}
.line .n{flex:1;min-width:0}
.line .n div{font-weight:600;font-size:0.9375rem}
.line .n small{color:var(--mute)}
.qty{display:flex;align-items:center;gap:0.375rem}
.qty button{width:2.125rem;height:2.125rem;border-radius:0.625rem;border:1px solid var(--line);background:var(--bg);font-size:1.25rem;font-weight:700}
.qty span{min-width:1.375rem;text-align:center;font-weight:700}
.line .t{width:3.875rem;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.foot{padding:0.875rem 1rem;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.cash{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.625rem;font-size:0.875rem;color:var(--mute)}
.cash input{flex:1;padding:0.625rem;width:100%}
.btn{border:0;border-radius:0.75rem;padding:0.875rem 1.125rem;font-weight:700;font-size:1rem;background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:0.5rem 0.75rem;font-size:0.875rem;border-radius:0.625rem}
.btn:disabled{opacity:.4}
.btn.full{width:100%}
.scroll{height:100%;overflow-y:auto;padding:1rem;max-width:56.25rem;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:0.875rem;padding:1rem;margin-bottom:0.875rem}
.card h3{margin:0 0 0.625rem;font-size:1rem}
.row{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.375rem,1fr));gap:0.75rem;margin-bottom:0.875rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:0.875rem;padding:0.875rem;min-width:0}
.stat small{color:var(--mute)}
.stat div{font-size:1.625rem;font-weight:800;margin-top:0.125rem;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:0.5625rem 0.375rem;border-bottom:1px solid var(--line);font-size:0.9375rem;font-variant-numeric:tabular-nums}
th{color:var(--mute);font-size:0.8125rem;font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
tfoot td{font-weight:800;border-bottom:0}
.itemrow{display:flex;align-items:center;gap:0.625rem;padding:0.625rem 0;border-bottom:1px solid var(--line)}
.itemrow .n{flex:1;min-width:0}
.mv{display:flex;gap:0.25rem}.mv button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:0.5rem;width:2.25rem;height:2.25rem;font-size:0.9375rem;padding:0}.mv button:disabled{opacity:.3}
.chip i.mvc{color:var(--accent);margin:0 0 0 0.25rem;padding:0.25rem 0.375rem}
.sugs{display:flex;flex-wrap:wrap;gap:0.375rem;margin-top:0.5rem;max-height:6.5rem;overflow:auto}.sugs button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:62.4375rem;padding:0.4375rem 0.875rem;font-size:0.875rem;font-weight:600}.sugs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.rsearch{width:100%;margin-bottom:0.375rem}.rline select[size]{height:auto}
.chip{display:inline-block;background:var(--accent2);color:var(--accent);border-radius:62.4375rem;padding:0.375rem 0.75rem;margin:0 0.375rem 0.375rem 0;font-size:0.875rem;font-weight:600}
.chip i{font-style:normal;margin-left:0.5rem;color:var(--bad);cursor:pointer;padding:0.25rem}
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:1rem;z-index:10}
.modal-bg.on{display:flex}
.modal{background:var(--card);border-radius:1rem;padding:1.25rem;width:100%;max-width:26.25rem;max-height:92%;overflow-y:auto}
.modal.wide{max-width:36.25rem}
.modal h3{margin:0 0 0.75rem}
.modal .f{display:flex;flex-direction:column;gap:0.375rem;margin-bottom:0.75rem}
.modal .f label{font-size:0.8125rem;color:var(--mute)}
.modal .f input,.modal .f select,.modal textarea{width:100%}
.modal textarea{height:11.25rem;font-family:"Courier New",monospace;font-size:0.75rem;resize:none}
.chk{display:flex;align-items:center;gap:0.625rem;margin-bottom:0.75rem;font-size:0.9375rem}
.pline{border:1px solid var(--line);border-radius:0.75rem;padding:0.625rem;margin-bottom:0.625rem;background:var(--bg)}
.pline select{flex:1;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.5rem;margin-top:0.5rem}
.pgrid .f{margin-bottom:0}
.rec{border:1px solid var(--line);border-radius:0.75rem;padding:0.75rem;margin-bottom:0.75rem;background:var(--bg)}
.rline{display:flex;gap:0.375rem;align-items:center;margin-bottom:0.5rem}
.rline select{flex:1;min-width:0}
.rline input{width:5.25rem}
.ru{min-width:1.75rem;color:var(--mute);font-size:0.875rem}
.rtot{display:flex;justify-content:space-between;font-size:1.0625rem;margin-top:0.625rem;font-variant-numeric:tabular-nums}
.receipt{font-family:"Courier New",monospace;font-size:0.875rem}
.receipt h2{text-align:center;margin:0 0 0.25rem;font-family:-apple-system,sans-serif}
.receipt .c{text-align:center;color:var(--mute)}
.receipt hr{border:0;border-top:1px dashed var(--mute);margin:0.625rem 0}
.receipt .l{display:flex;justify-content:space-between;gap:0.5rem;padding:0.125rem 0}
.receipt .sub{color:var(--mute);font-size:0.75rem}
.receipt .tot{font-size:1.125rem;font-weight:800}
.toast{position:fixed;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:0.625rem 1.125rem;border-radius:62.4375rem;font-size:0.875rem;display:none;z-index:20;max-width:90%;text-align:center}
.void{color:var(--bad);font-weight:700}
.note{color:var(--mute);font-size:0.8125rem;margin-top:0.5rem}
.neg{color:var(--bad);font-weight:700}
.sync{font-size:0.75rem;color:var(--mute);white-space:nowrap}
.sync.bad{color:var(--bad);font-weight:700}
.boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:30;color:var(--mute);font-size:1rem}
.sizebtn{border:1px solid var(--line);background:var(--bg);border-radius:.625rem;padding:.5rem .75rem;font-weight:700;font-size:1rem;color:var(--ink)}
button.sync{border:0;background:transparent;padding:0;font:inherit;font-size:.75rem}
.numpad{display:grid;grid-template-columns:minmax(5.25rem,1.7fr) repeat(11,minmax(0,1fr));gap:0.375rem;padding:0.5rem 1rem 0.625rem;border-top:1px solid var(--line);background:var(--card);flex-shrink:0}
.npk,.npq{height:3rem;border-radius:0.625rem;border:1px solid var(--line);background:var(--bg);font-size:1.25rem;font-weight:700;padding:0}
.npk:active{background:var(--accent2)}
.npq{font-size:0.9375rem;color:var(--mute);white-space:nowrap}
.npq.set{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.drows{margin-bottom:0.375rem}
.dr{display:flex;justify-content:space-between;gap:0.5rem;font-size:0.9375rem;color:var(--mute);padding:1px 0;font-variant-numeric:tabular-nums}
.dr .lnk{border:0;background:transparent;color:var(--bad);font-weight:700;padding:0.125rem 0.375rem;font-size:0.9375rem}
.act{display:flex;gap:0.5rem}
.seg{display:flex;gap:0.375rem;margin-bottom:0.75rem}
.seg button{flex:1;padding:0.625rem 0.375rem;border-radius:0.625rem;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:0.9375rem}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.quick{display:flex;gap:0.375rem;flex-wrap:wrap;margin-bottom:0.75rem}
@media(max-width:560px){.numpad{grid-template-columns:repeat(6,minmax(0,1fr))}.npq{grid-column:span 2}.long{display:none}}
@media(max-width:560px){.ccard{flex-wrap:wrap}.ccard .n{flex:1 1 55%}.ccard>.row{width:100%}.ccard>.row .btn:not(.sm){flex:1}.hgrid{grid-template-columns:1fr}.hbtn{min-height:8rem}}
@media(max-width:820px){.nav{flex-wrap:wrap}.nav button{padding:0.5625rem 0.5625rem}#v-sale.on{flex-direction:column}.cart{width:100%;height:46%;border-left:0;border-top:1px solid var(--line)}.nav button{padding:0.625rem 0.625rem;font-size:0.875rem}}
@media(max-width:560px){
 .cart{height:56%}
 .cart h2{padding:0.5rem 1rem}
 .foot{padding:0.5rem 1rem 0.625rem}
 .total{font-size:1.375rem}
 #cartLbp{margin-bottom:0.375rem!important}
 .cash{margin-bottom:0.375rem}
 .cash input{padding:0.5rem}
 .act .btn{padding:0.75rem 0.875rem}
 .npk,.npq{height:2.625rem}
 .numpad{padding:0.375rem 1rem 0.5rem}
 .dr{font-size:0.875rem}
 .drows{margin-bottom:0.25rem}
}
@media(max-width:480px){.pgrid{grid-template-columns:1fr 1fr}.pgrid .f:last-child{grid-column:1/-1}}
</style>
</head>
<body>


<div class="app">
 <header>
  <h1 id="storeTitle">Kiosk POS</h1>
  <button id="sync" class="sync" type="button"></button><button class="sizebtn" id="sizeBtn" type="button" aria-label="Change text size">Aa</button>
  <div class="nav">
   <button data-v="home" class="on">Home</button>
   <button data-v="sale">Fast order</button>
   <button data-v="clients">Clients</button>
   <button data-v="stock">Stock</button>
   <button data-v="purchases">Purchases</button>
   <button data-v="report"><span class="long">Daily </span>Report</button>
   <button data-v="items">Items</button>
  </div>
 </header>
 <main>
  <section class="view on" id="v-home"><div class="scroll" id="homeView"></div></section>
  <section class="view" id="v-clients"><div class="scroll" id="clientsView"></div></section>
  <section class="view" id="v-sale">
   <div class="left">
    <div class="tabbar" id="tabBar" hidden></div>
    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"></div>
    <div class="numpad" id="numpad"></div>
   </div>
   <div class="cart">
    <h2><span id="cartTitle">Current order</span> <span class="hb"><button class="btn sec sm" id="clearLast">Clear last</button><button class="btn sec sm" id="clearAll">Clear all</button></span></h2>
    <div class="lines" id="lines"></div>
    <div class="foot">
     <div class="drows" id="discRows" hidden></div>
     <div class="total"><span>Total</span><span id="cartTotal">$0.00</span></div>
     <div id="cartLbp" style="text-align:right;font-weight:700;color:var(--accent);margin-bottom:0.625rem;font-size:1rem">0 LL</div>
     <div class="cash"><span>Cash received (LL)</span><input id="cash" type="number" inputmode="numeric" step="1000" min="0" placeholder="optional, in LL"></div>
     <div class="cash" id="changeRow" hidden><span>Change due</span><b id="change" style="color:var(--ok);font-size:1.125rem"></b></div>
     <div class="act"><button class="btn sec" id="discBtn" disabled>Discount</button><button class="btn" id="checkout" style="flex:1" disabled>Checkout &amp; Invoice</button></div>
    </div>
   </div>
  </section>
  <section class="view" id="v-stock"><div class="scroll" id="stockView"></div></section>
  <section class="view" id="v-purchases"><div class="scroll" id="purchasesView"></div></section>
  <section class="view" id="v-report"><div class="scroll" id="report"></div></section>
  <section class="view" id="v-items"><div class="scroll" id="itemsView"></div></section>
 </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>

var KEY='kioskpos_v1';
var APP_VER=15,UI_KEY='kioskpos_ui',SIZES=[{n:'Normal',s:1},{n:'Large',s:1.2},{n:'Extra large',s:1.4},{n:'Huge',s:1.6}],sizeIdx=0;
function applySize(){document.documentElement.style.fontSize=(16*SIZES[sizeIdx].s)+'px'}
var lastItemCat='';
function saveUi(){try{localStorage.setItem(UI_KEY,JSON.stringify({size:sizeIdx,cat:lastItemCat}))}catch(e){}}
function loadUi(){try{var u=JSON.parse(localStorage.getItem(UI_KEY)||'{}');if(u.size>=0&&u.size<SIZES.length)sizeIdx=u.size;if(typeof u.cat==='string')lastItemCat=u.cat}catch(e){}}
function setSize(i){sizeIdx=i;applySize();saveUi()}
loadUi();applySize();
var S={store:'My Kiosk',rate:89500,cats:['Drinks','Cigarettes','Purchases'],items:[],sales:[],counter:0,purchases:[],pcounter:0,days:[],units:['pcs','kg','g','L','ml'],tabs:[]};
var cart={},cartOrder=[]; var curCat=null; var reportSel='open'; var curView='home';
var activeTab=null,fastStash=null;
var storageOK=true;

function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);for(var k in d)S[k]=d[k];}}catch(e){storageOK=false}}

/* Storage: this device only (localStorage), works with no internet. */
function backupDue(){return (S.items.length>0)&&(!S.lastBackup||Date.now()-S.lastBackup>3*86400000)}
function setSync(st){
 var e=document.getElementById('sync');if(!e)return;
 if(st==='error'){e.textContent='Could not save on this device';e.className='sync bad';return}
 if(backupDue()){e.textContent='Back up your data';e.className='sync bad'}
 else{e.textContent='Works offline · v'+APP_VER;e.className='sync'}
}
function save(){
 try{menuCheck()}catch(e){}
 try{localStorage.setItem(KEY,JSON.stringify(S));setSync('saved')}
 catch(e){storageOK=false;setSync('error');toast('Could not save on this iPad. Make a backup now.')}
}

function migrate(){
 if(!S.purchases)S.purchases=[]; if(!S.pcounter)S.pcounter=0;
 if(!S.tabs)S.tabs=[];
 if(!S.days)S.days=[]; if(!S.units||!S.units.length)S.units=['pcs','kg','g','L','ml'];
 var extra=[];
 S.items.forEach(function(i){
  if(i.track===undefined)i.track=false;if(i.stock===undefined)i.stock=0;if(i.cost===undefined)i.cost=0;if(!i.unit)i.unit='pcs';if(!i.recipe)i.recipe=[];if(i.noSale===undefined)i.noSale=false;
  if(!i.kind){
   if(i.recipe.length)i.kind='sale';
   else if(i.noSale)i.kind='stock';
   else if(i.track){
    /* an older item that held its own stock: it becomes a stock item, and a sale item with the same name uses it */
    i.kind='stock';
    extra.push({id:uid(),kind:'sale',name:i.name,price:i.price,cat:i.cat,noSale:false,recipe:[{itemId:i.id,qty:1}],track:false,unit:'pcs',stock:0,cost:0});
    i.price=0;i.cat='';
   }
   else i.kind='sale';
  }
  if(i.kind==='stock'){i.track=true;if(i.supplier===undefined)i.supplier='';if(!i.buyUnit)i.buyUnit=i.unit;if(!(i.factor>0))i.factor=1}
 });
 extra.forEach(function(x){S.items.push(x)});
 S.items.forEach(function(i){if(i.kind==='stock'){[i.unit,i.buyUnit].forEach(function(u){if(u&&S.units.indexOf(u)<0)S.units.push(u)})}});
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '$'+(Math.round(n*100)/100).toFixed(2)}
function payLL(usd,r){var v=usd*(r||S.rate||0);return v<=0.5?0:Math.ceil((v-0.5)/5000)*5000}
function lbp(n,r){return Math.round(n*(r||S.rate||0)).toLocaleString('en-US')+' LL'}
function fmtLL(n){return Math.round(n).toLocaleString('en-US')+' LL'}
function fmtN(n){return String(Math.round(n*1000)/1000)}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function r2(n){return String(Math.round(n*100)/100)}
function r4(n){return String(Math.round(n*10000)/10000)}
function pad(n,w){n=String(n);while(n.length<w)n='0'+n;return n}
function dkey(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)}
function today(){return dkey(Date.now())}
function fmtTime(ts){var d=new Date(ts);return pad(d.getHours(),2)+':'+pad(d.getMinutes(),2)}
function fmtDT(ts){return dkey(ts)+' '+fmtTime(ts)}
function dateToTs(ds){var p=String(ds).split('-');if(p.length!==3)return Date.now();var n=new Date();return new Date(+p[0],+p[1]-1,+p[2],n.getHours(),n.getMinutes()).getTime()}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},2600)}
function $(id){return document.getElementById(id)}
function findItem(id){for(var i=0;i<S.items.length;i++)if(S.items[i].id===id)return S.items[i];return null}
function isBuyable(i){return i.kind==='stock'}
function fct(i){return i.factor>0?i.factor:1}
function buyU(i){return i.buyUnit||i.unit}
function stockText(i){var f=fct(i);if(buyU(i)===i.unit&&f===1)return fmtN(i.stock)+' '+i.unit;return fmtN(i.stock/f)+' '+buyU(i)+' ('+fmtN(i.stock)+' '+i.unit+')'}
function suggestFactor(b,u){if(b===u)return 1;var t={'l>ml':1000,'kg>g':1000,'l>cl':100,'cl>ml':10,'m>cm':100};return t[(b+'>'+u).toLowerCase()]||null}
function unitOptHtml(sel){var l=S.units.slice();if(sel&&l.indexOf(sel)<0)l.push(sel);return l.map(function(u){return '<option value="'+esc(u)+'"'+(u===sel?' selected':'')+'>'+esc(u)+'</option>'}).join('')}
function itemCost(i){
 if(i.recipe&&i.recipe.length){var t=0;i.recipe.forEach(function(r){var g=findItem(r.itemId);if(g)t+=r.qty*(g.cost||0)});return t}
 return i.cost||0;
}
function canMake(i){
 if(!i.recipe||!i.recipe.length)return null;
 var n=Infinity;
 for(var k=0;k<i.recipe.length;k++){var r=i.recipe[k],g=findItem(r.itemId);if(!g||!g.track||!(r.qty>0))return null;n=Math.min(n,Math.floor(Math.max(g.stock,0)/r.qty+1e-9))}
 return n===Infinity?null:n;
}
function itemSub(i){
 var parts=[];
 if(i.recipe&&i.recipe.length){
  var c=itemCost(i);parts.push('Recipe cost '+money(c));
  if(c>0&&i.price>0)parts.push('margin '+Math.round((i.price-c)/i.price*100)+'%');
 }
 return parts.length?'<div style="color:var(--mute);font-size:0.75rem">'+parts.join(' · ')+'</div>':'';
}

/* SALE */
var qtyBuf='',disc=null;
function qtyN(){var v=parseFloat(qtyBuf);return v>0?v:1}
function r3(n){return Math.round(n*1000)/1000}
function updateNumpad(){var q=$('npq');if(!q)return;q.textContent=qtyBuf?'×'+qtyBuf+'  ✕':'×1';q.classList.toggle('set',!!qtyBuf)}
function pressDigit(d){var b=qtyBuf;
 if(d==='.'){if(b.indexOf('.')>=0)return;b=(b||'0')+'.'}else{if(b==='0')b='';b+=d}
 var pr=b.split('.');if(pr[0].length>3||(pr[1]||'').length>2)return;
 qtyBuf=b;updateNumpad()}
function buildNumpad(){
 var h='<button class="npq" id="npq" aria-label="Quantity for the next item. Tap to reset"></button>';
 '1234567890.'.split('').forEach(function(d){h+='<button class="npk" data-d="'+d+'">'+d+'</button>'});
 $('numpad').innerHTML=h;
 $('numpad').querySelectorAll('.npk').forEach(function(b){b.onclick=function(){pressDigit(b.dataset.d)}});
 $('npq').onclick=function(){qtyBuf='';updateNumpad()};
 updateNumpad();
}
function addUnits(id,n){n=r3(n);cart[id]=r3((cart[id]||0)+n);var w=Math.floor(n+1e-9),f=r3(n-w),k;for(k=0;k<w;k++)cartOrder.push({id:id,q:1});if(f>0)cartOrder.push({id:id,q:f})}
function dropAmt(id,q){cart[id]=r3((cart[id]||0)-q);if(cart[id]<=0.0005)delete cart[id]}
function addUnit(id){addUnits(id,1)}
function removeUnit(id){if(!cart[id])return;var k=-1,j;for(j=cartOrder.length-1;j>=0;j--)if(cartOrder[j].id===id){k=j;break}
 if(k>=0){var q=cartOrder[k].q;cartOrder.splice(k,1);dropAmt(id,q)}else delete cart[id]}
function stockLine(i){
 var cm=canMake(i);
 if(cm!==null)return cm<=0?'<span class="stk out">Out of stock</span>':'<span class="stk">'+cm+' can be made</span>';
 if(!i.track)return '';
 return i.stock<=0?'<span class="stk out">Out of stock</span>':'<span class="stk">'+fmtN(i.stock)+' '+esc(i.unit)+' left</span>';
}
function renderSale(){
 $('storeTitle').textContent=S.store||'Kiosk POS';
 if(!curCat||S.cats.indexOf(curCat)<0)curCat=S.cats[0]||null;
 $('cats').innerHTML=S.cats.map(function(c){return '<button class="'+(c===curCat?'on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join('');
 $('cats').querySelectorAll('button').forEach(function(b){b.onclick=function(){curCat=b.dataset.c;renderSale()}});
 var list=S.items.filter(function(i){return i.cat===curCat&&i.kind==='sale'});

  var q=cart[i.id]||0;
  return '<button class="tile" data-id="'+i.id+'">'+(q?'<div class="badge">'+fmtN(q)+'</div>':'')+'<div><b>'+esc(i.name)+'</b>'+stockLine(i)+'</div><div><span>'+money(i.price)+'</span><small>'+lbp(i.price)+'</small></div></button>'}).join('')
  :'<div class="empty">No items in this category yet. Open the <b>Items</b> tab to add some.</div>';

 }});
 renderCart();

function cartSub(){var t=0;for(var id in cart){var it=findItem(id);if(it)t+=it.price*cart[id]}return Math.round(t*100)/100}
function amountFor(t,v,sub){var a=(t==='pct')?sub*v/100:(t==='usd'?v:v/(S.rate||1));a=Math.round(a*100)/100;return Math.max(0,Math.min(a,sub))}
function discAmt(){return disc?amountFor(disc.type,disc.value,cartSub()):0}
function cartTotal(){return Math.round((cartSub()-discAmt())*100)/100}
function discLabel(d){return d.type==='pct'?fmtN(d.value)+'%':(d.type==='usd'?money(d.value):Number(d.value).toLocaleString('en-US')+' LL')}
function discountDialog(){

 var d={type:disc?disc.type:'pct',value:disc?String(disc.value):''};
 openModal('<h3>Discount</h3><div class="note" style="margin:0 0 0.75rem">Order subtotal '+money(sub)+'</div>'+
 '<div class="seg"><button data-t="pct">Percent %</button><button data-t="usd">Amount $</button><button data-t="lbp">Amount LL</button></div>'+
 '<div class="quick" id="dQuick">'+[5,10,15,20,50].map(function(v){return '<button class="btn sec sm" data-q="'+v+'">'+v+'%</button>'}).join('')+'</div>'+
 '<div class="f"><label for="dVal" id="dLab">Discount</label><input id="dVal" type="number" inputmode="decimal" step="any" min="0" value="'+esc(d.value)+'"></div>'+
 '<div class="note" id="dPrev" style="margin:0 0 0.875rem"></div>'+
 '<div class="row"><button class="btn" id="dApply" style="flex:1">Apply</button>'+(disc?'<button class="btn bad" id="dRem">Remove</button>':'')+'<button class="btn sec" id="dCancel">Cancel</button></div>');
 function upd(){

  $('dQuick').hidden=(d.type!=='pct');
  $('dLab').textContent={pct:'Discount percent (%)',usd:'Discount amount ($)',lbp:'Discount amount (LL)'}[d.type];
  var v=num(d.value),a=amountFor(d.type,v,sub);
  var raw=(d.type==='pct')?sub*v/100:(d.type==='usd'?v:v/(S.rate||1));
  $('dPrev').textContent=v>0?('Discount −'+money(a)+(a<raw-0.005?' (limited to the subtotal)':'')+' → new total '+money(sub-a)+' · '+lbp(sub-a)):'Enter a discount value.';
 }

  if(d.type==='pct'&&v>100){toast('Percent cannot be more than 100');return}
  disc={type:d.type,value:v};closeModal();renderCart();

}
function renderCart(){
 var ids=Object.keys(cart).filter(function(id){return findItem(id)});
 if(!ids.length)disc=null;
 $('lines').innerHTML=ids.length?ids.map(function(id){var it=findItem(id),q=cart[id];
  return '<div class="line"><div class="n"><div>'+esc(it.name)+'</div><small>'+money(it.price)+' each</small></div>'+
  '<div class="qty"><button data-m="'+id+'">−</button><span>'+fmtN(q)+'</span><button data-p="'+id+'">+</button></div>'+
  '<div class="t">'+money(it.price*q)+'</div></div>'}).join(''):'<div class="empty" style="padding:1.25rem 0.5rem">Tap items to add them.</div>';
 $('lines').querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){removeUnit(b.dataset.m);renderSale()}});

 });

 d.lines.forEach(function(l,i){
  var sel=$('pItem'+i),q=$('pq'+i),c=$('pc'+i),t=$('pt'+i);
  function unitLbl(){$('pu'+i).textContent='('+l.u+')';$('pcl'+i).textContent='Cost per '+l.u+' ($)';$('pcv'+i).textContent=convTxt(l)}
  unitLbl();

  $('pun'+i).onchange=function(){l.u=this.value;if(l.total!==''&&num(l.qty)>0){l.unit=r4(num(l.total)/num(l.qty));c.value=l.unit}unitLbl()};

  t.oninput=function(){l.total=this.value;if(l.total!==''&&num(l.qty)>0){l.unit=r4(num(l.total)/num(l.qty));c.value=l.unit}ptotal()};
 });

function savePurchase(){
 var d=pDraft,lines=[];
 for(var i=0;i<d.lines.length;i++){
  var l=d.lines[i],q=num(l.qty);
  if(q<=0)continue;
  var it=findItem(l.itemId);if(!it){toast('Pick an item for every line');return}
  var u=l.u||buyU(it);
  var total=l.total!==''?num(l.total):(l.unit!==''?q*num(l.unit):0);
  lines.push({itemId:it.id,name:it.name,unit:u,qty:q,baseQty:baseQtyOf(it,u,q),unitCost:total/q,total:Math.round(total*100)/100});
 }
 if(!lines.length){toast('Enter a quantity for at least one item');return}
 var sum=0;
 lines.forEach(function(l){
  var it=findItem(l.itemId);
  var ucb=l.baseQty>0?l.total/l.baseQty:0;
  if(ucb>0){
   var base=it.track?Math.max(it.stock,0):0;
   it.cost=(base>0&&it.cost>0)?(base*it.cost+l.baseQty*ucb)/(base+l.baseQty):ucb;
   it.cost=Math.round(it.cost*1e8)/1e8;
  }
  it.stock=Math.round(((it.track?it.stock:0)+l.baseQty)*1000)/1000;
  it.track=true;
  sum+=l.total;
 });
 S.pcounter++;
 S.purchases.push({id:uid(),no:S.pcounter,ts:dateToTs(d.date),supplier:d.supplier.trim(),lines:lines,total:Math.round(sum*100)/100,rate:S.rate});

function ingredientOptions(sel,q){
 var list=ingMatches(q);
 if(sel&&!list.some(function(i){return i.id===sel})){var cur=findItem(sel);if(cur)list.unshift(cur)}
 return list.map(function(i){return '<option value="'+i.id+'"'+(i.id===sel?' selected':'')+'>'+esc(i.name)+(i.supplier?' · '+esc(i.supplier):'')+' (recipe unit '+esc(i.unit)+(i.cost>0?', '+money(i.cost*fct(i))+'/'+esc(buyU(i)):'')+')</option>'}).join('');
}
/* menu photos live in IndexedDB (too big for localStorage) */
var PH={},phDb=null;
function phOpen(cb){try{var r=indexedDB.open('kioskpos_photos',1);r.onupgradeneeded=function(){r.result.createObjectStore('p')};r.onsuccess=function(){phDb=r.result;phLoad(cb)};r.onerror=function(){cb&&cb()}}catch(e){cb&&cb()}}
function phLoad(cb){try{var rq=phDb.transaction('p').objectStore('p').openCursor();rq.onsuccess=function(){var c=rq.result;if(c){PH[c.key]=c.value;c.continue()}else cb&&cb()};rq.onerror=function(){cb&&cb()}}catch(e){cb&&cb()}}
function phPut(id,v){PH[id]=v;try{menuDirty()}catch(e){}if(!phDb)return;try{phDb.transaction('p','readwrite').objectStore('p').put(v,id)}catch(e){}}
function phDel(id){delete PH[id];try{menuDirty()}catch(e){}if(!phDb)return;try{phDb.transaction('p','readwrite').objectStore('p').delete(id)}catch(e){}}
function menuOn(i){return i.menu!==undefined?!!i.menu:!/cig/i.test(i.cat||'')}
function shrinkPhoto(file,cb){
 var r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){
  var m=480,w=im.width,h=im.height,k=Math.min(1,m/Math.max(w,h));
  var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.68));
 };im.onerror=function(){cb(null)};im.src=r.result};
 r.onerror=function(){cb(null)};r.readAsDataURL(file);
}
function buildMenu(){
 var cats=[];
 S.cats.forEach(function(c){
  var items=S.items.filter(function(i){return i.kind==='sale'&&i.cat===c&&menuOn(i)}).map(function(i){var o={n:i.name,p:i.price};if(PH[i.id])o.img=PH[i.id];return o});
  if(items.length)cats.push({name:c,items:items});
 });
 return {store:S.store||'',updated:today(),cats:cats};
}
function publishMenuDialog(){
 var m=buildMenu(),n=0,ph=0;m.cats.forEach(function(c){c.items.forEach(function(i){n++;if(i.img)ph++})});
 if(!n){toast('No items are set to show on the menu');return}
 var txt=JSON.stringify(m),kb=Math.round(txt.length/1024);
 openModal('<h3>Publish menu</h3><div class="note" style="margin:0 0 0.75rem"><b>'+n+' items</b> in '+m.cats.length+' categories, '+ph+' with photos ('+kb+' KB).</div>'+
  '<ol style="margin:0 0 1rem;padding-left:1.25rem;line-height:1.6"><li>Tap <b>Save menu.json</b>.</li><li>Open your GitHub repository and tap <b>Add file → Upload files</b>.</li><li>Choose <b>menu.json</b> (it replaces the old one) and tap <b>Commit changes</b>.</li><li>Wait one minute, then open the menu link to check it.</li></ol>'+
  '<div class="row"><button class="btn" id="mSave" style="flex:1">Save menu.json</button><button class="btn sec" id="mClose2">Close</button></div>');
 $('mClose2').onclick=closeModal;
 $('mSave').onclick=function(){try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='menu.json';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},800);toast('Saved menu.json. Now upload it to GitHub.')}catch(e){toast('Could not save the file')}};
}
/* automatic menu publishing to GitHub (token stays on this device only, not in backups) */
var GH_KEY='kioskpos_gh',gh={repo:'',branch:'main',token:'',pending:false,last:0,err:'',sig:''},ghBusy=false,ghTimer=null,lastSig=null;
function ghLoad(){try{var u=JSON.parse(localStorage.getItem(GH_KEY)||'{}');for(var k in u)gh[k]=u[k]}catch(e){}}
function ghSave(){try{localStorage.setItem(GH_KEY,JSON.stringify(gh))}catch(e){}}
function ghOn(){return !!(gh.repo&&gh.token)}
function menuUrl(){var p=gh.repo.split('/');return p.length===2?'https://'+p[0].toLowerCase()+'.github.io/'+p[1]+'/menu.html':''}
function menuSig(){return S.cats.join('|')+'#'+S.items.filter(function(i){return i.kind==='sale'}).map(function(i){return i.id+':'+i.name+':'+i.price+':'+i.cat+':'+(menuOn(i)?1:0)}).join(';')}
function menuCheck(){var g=menuSig();if(lastSig===null){lastSig=g;return}if(g!==lastSig){lastSig=g;menuDirty()}}
function menuDirty(){if(!ghOn())return;gh.pending=true;ghSave();clearTimeout(ghTimer);ghTimer=setTimeout(function(){ghPublish(false)},4000);ghStatus()}
function ghStatus(msg){
 var e=$('ghStat');if(!e)return;
 var t,c='';
 if(msg){t=msg}
 else if(!ghOn()){t='Not connected. Without it you must upload menu.json to GitHub yourself after each change.'}
 else if(gh.err){t='⚠️ '+gh.err;c='var(--bad)'}
 else if(gh.pending||ghBusy){t='⏳ Changes waiting to be published…'}
 else if(gh.last){t='✅ Menu is up to date. Last published '+fmtDT(gh.last);c='var(--ok)'}
 else t='Connected. Tap Publish now.';
 e.textContent=t;e.style.color=c;
}
function ghPublish(manual,retry){
 if(!ghOn()){return}
 if(ghBusy){gh.pending=true;return}
 if(navigator.onLine===false){gh.err='No internet. It will publish when the connection is back.';gh.pending=true;ghSave();ghStatus();if(manual)toast('No internet right now');return}
 ghBusy=true;gh.err='';gh.pending=false;ghStatus('Publishing…');
 var txt=JSON.stringify(buildMenu()),b64=btoa(unescape(encodeURIComponent(txt)));
 var url='https://api.github.com/repos/'+gh.repo+'/contents/menu.json';
 var H={'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github+json'};
 function fail(m,keep){ghBusy=false;gh.err=m;if(keep)gh.pending=true;ghSave();ghStatus();if(manual)toast(m)}
 fetch(url+'?ref='+encodeURIComponent(gh.branch)+'&t='+Date.now(),{headers:H,cache:'no-store'}).then(function(r){
  if(r.status===404)return null;
  if(r.status===401){throw {m:'GitHub rejected the token. Create a new token in Settings.'}}
  if(!r.ok)throw {m:'GitHub error '+r.status+' while checking the menu file.'};
  return r.json();
 }).then(function(cur){
  var body={message:'Update menu '+today(),content:b64,branch:gh.branch};if(cur&&cur.sha)body.sha=cur.sha;
  return fetch(url,{method:'PUT',headers:{'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
 }).then(function(r){
  if(r.ok){ghBusy=false;gh.last=Date.now();gh.err='';ghSave();ghStatus();if(manual)toast('Menu published. It may take a minute to appear.');if(gh.pending){clearTimeout(ghTimer);ghTimer=setTimeout(function(){ghPublish(false)},1500)}return}
  if((r.status===409||r.status===422)&&!retry){ghBusy=false;return ghPublish(manual,true)}
  if(r.status===401)throw {m:'GitHub rejected the token. Create a new token in Settings.'};
  if(r.status===403||r.status===404)throw {m:'No permission or wrong repository name. Check the repository and that the token allows Contents: Read and write.'};
  throw {m:'GitHub error '+r.status+'.'};
 }).catch(function(e){
  if(e&&e.m)fail(e.m,false);else fail('No internet. It will publish when the connection is back.',true);
 });
}
function ghDialog(){
 openModal('<h3>Automatic menu publishing</h3>'+
  '<div class="note" style="margin:0 0 0.75rem">The app sends your menu to GitHub by itself after you add or change items, prices or photos. The token is saved on this device only and is not part of backups.</div>'+
  '<div class="f"><label for="ghRepo">GitHub repository (owner/name)</label><input id="ghRepo" value="'+esc(gh.repo)+'" placeholder="hassandhr/app-test" autocapitalize="off" autocorrect="off" spellcheck="false"></div>'+
  '<div class="f"><label for="ghTok">Token</label><input id="ghTok" type="password" value="'+esc(gh.token)+'" placeholder="paste the token here" autocapitalize="off" autocorrect="off" spellcheck="false"></div>'+
  '<div class="f"><label for="ghBr">Branch</label><input id="ghBr" value="'+esc(gh.branch||'main')+'" autocapitalize="off"></div>'+
  '<details style="margin:0 0 0.75rem"><summary style="font-weight:700;cursor:pointer">How to create the token</summary><ol style="margin:0.5rem 0 0;padding-left:1.25rem;line-height:1.6;font-size:0.9375rem"><li>On github.com tap your profile picture → <b>Settings</b> → scroll to the bottom → <b>Developer settings</b>.</li><li><b>Personal access tokens → Fine-grained tokens → Generate new token</b>.</li><li>Name: <i>kiosk menu</i>. Expiration: the longest choice.</li><li><b>Repository access → Only select repositories</b> and pick your menu repository.</li><li><b>Permissions → Repository permissions → Contents → Read and write</b>.</li><li>Tap <b>Generate token</b>, copy it now (GitHub shows it once) and paste it above.</li></ol></details>'+
  '<div class="row"><button class="btn" id="ghOk" style="flex:1">Save and publish</button>'+(ghOn()?'<button class="btn bad" id="ghOff">Disconnect</button>':'')+'<button class="btn sec" id="ghNo">Cancel</button></div>');
 $('ghNo').onclick=closeModal;
 $('ghOk').onclick=function(){
  var r=$('ghRepo').value.trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\/+$/,''),t=$('ghTok').value.trim(),b=$('ghBr').value.trim()||'main';
  if(!/^[\w.-]+\/[\w.-]+$/.test(r)){toast('Write the repository like owner/name');return}
  if(!t){toast('Paste the token');return}
  gh.repo=r;gh.token=t;gh.branch=b;gh.err='';ghSave();closeModal();renderItems();ghPublish(true);
 };
 if($('ghOff'))$('ghOff').onclick=function(){gh.token='';gh.pending=false;gh.err='';ghSave();closeModal();renderItems()};
}
ghLoad();
window.addEventListener('online',function(){if(ghOn()&&gh.pending)ghPublish(false)});
function lastCatGuess(){
 if(S.cats.indexOf(lastItemCat)>=0)return lastItemCat;
 for(var k=S.items.length-1;k>=0;k--){if(S.items[k].kind==='sale'&&S.cats.indexOf(S.items[k].cat)>=0)return S.items[k].cat}
 return curCat||S.cats[0];
}
function editItem(id){
 var it=id?findItem(id):null;
 eDraft=it?{id:it.id,name:it.name,price:String(it.price),cat:it.cat,recipe:(it.recipe||[]).map(function(r){return {itemId:r.itemId,qty:String(r.qty),q:''}}),margin:'',menu:menuOn(it),photo:undefined}
  :{id:null,name:'',price:'',cat:lastCatGuess(),recipe:[],margin:'',menu:true,photo:undefined};
 if(!it)eDraft.menu=menuOn({cat:eDraft.cat});
 renderEdit();
}
function renderEdit(){
 var d=eDraft,hasRec=d.recipe.length>0,cands=ingCands();
 var h='<h3>'+(d.id?'Edit item':'New item')+'</h3>'+
 '<div class="f"><label for="iName">Name</label><input id="iName" value="'+esc(d.name)+'" placeholder="e.g. Espresso"></div>'+
 '<div class="f"><label for="iPrice">Selling price (USD)</label><input id="iPrice" type="number" inputmode="decimal" step="0.01" min="0" value="'+esc(d.price)+'" placeholder="0.00"></div>'+
 '<div class="f"><label for="iCat">Category</label><select id="iCat">'+S.cats.map(function(c){return '<option'+(d.cat===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></div>';
 var curPh=d.photo!==undefined?d.photo:(d.id?PH[d.id]:'');
 h+='<div class="f"><div class="chkrow"><input type="checkbox" id="iMenu"'+(d.menu?' checked':'')+'><label for="iMenu">Show on the customer menu</label></div></div>'+
  '<div class="f"><label>Photo for the menu</label><div class="phrow"><img id="iPh" class="phimg" alt=""'+(curPh?' src="'+curPh+'"':' hidden')+'><button class="btn sec sm" id="iPhBtn" type="button">📷 Take / choose photo</button><button class="btn bad sm" id="iPhDel" type="button"'+(curPh?'':' hidden')+'>Remove</button><input type="file" id="iPhFile" accept="image/*" hidden></div></div>';
 h+='<div class="rec"><div style="font-weight:700;margin-bottom:0.25rem">Recipe</div><div class="note" style="margin:0 0 0.625rem">Pick the stock items that go into one of these and how much of each. Each sale takes these amounts out of stock, and the recipe sets the cost.</div>';
 if(!cands.length&&!hasRec){
  h+='<div class="note" style="margin:0">You have no stock items yet. Add them in the Stock tab (for example coffee beans or a box of chips) and buy them there. They will then show up here.</div>';
 }else{
  d.recipe.forEach(function(l,i){
   var g=findItem(l.itemId);
   h+='<input class="rsearch" id="rS'+i+'" type="search" aria-label="Search stock items" placeholder="🔍 Search stock items (type a name)" value="'+esc(l.q||'')+'"><div class="rline"><select id="rI'+i+'" aria-label="Stock item"'+(l.q?' size="'+Math.max(2,Math.min(5,ingMatches(l.q).length))+'"':'')+'>'+ingredientOptions(l.itemId,l.q)+'</select><input id="rQ'+i+'" aria-label="Quantity" type="number" inputmode="decimal" step="any" min="0" value="'+esc(l.qty)+'" placeholder="Qty"><span class="ru" id="rU'+i+'">'+(g?esc(g.unit):'')+'</span><button class="btn bad sm" data-rdel="'+i+'" aria-label="Remove">✕</button></div>';
  });
  h+='<button class="btn sec sm" id="rAdd">+ Add from stock</button>';
 }
 if(hasRec){
  h+='<div class="rtot"><span>Recipe cost per item</span><b id="rCost"></b></div><div id="rCostL" class="note" style="margin:0.125rem 0 0;text-align:right"></div>'+
  '<div class="row" style="margin-top:0.625rem"><input id="rM" aria-label="Target margin percent" type="number" inputmode="decimal" step="any" min="0" max="99" placeholder="Margin %" value="'+esc(d.margin)+'" style="width:7.5rem"><button class="btn sec sm" id="rSug">Suggest price</button><span id="rNow" class="note" style="margin:0"></span></div>';
 }
 h+='</div><div class="row"><button class="btn" id="iSave" style="flex:1">Save</button>'+(d.id?'<button class="btn bad" id="iDel">Delete</button>':'')+'<button class="btn sec" id="iCancel">Cancel</button></div>';
 openModal(h,true);
 wireEdit();
}
function wireEdit(){
 var d=eDraft;
 function recInfo(){
  if(!$('rCost'))return;
  var c=recCost(d),missing=d.recipe.some(function(l){var g=findItem(l.itemId);return !g||!(g.cost>0)});
  $('rCost').textContent=money(c);
  $('rCostL').textContent=lbp(c)+(missing?' · some stock items have no cost yet':'');
  var p=num(d.price);
  $('rNow').textContent=(p>0&&c>0)?'Current margin '+Math.round((p-c)/p*100)+'%':'';
 }
 $('iName').oninput=function(){d.name=this.value};
 $('iPrice').oninput=function(){d.price=this.value;recInfo()};
 $('iCat').onchange=function(){d.cat=this.value};
 $('iMenu').onchange=function(){d.menu=this.checked};
 $('iPhBtn').onclick=function(){$('iPhFile').click()};
 $('iPhFile').onchange=function(){var f=this.files[0];if(!f)return;shrinkPhoto(f,function(u){if(!u){toast('Could not read that photo');return}d.photo=u;$('iPh').src=u;$('iPh').hidden=false;$('iPhDel').hidden=false})};
 $('iPhDel').onclick=function(){d.photo='';$('iPh').hidden=true;$('iPh').removeAttribute('src');this.hidden=true};
 d.recipe.forEach(function(l,i){
  $('rS'+i).oninput=function(){
   l.q=this.value;var sel=$('rI'+i),m=ingMatches(l.q);
   if(l.q&&m.length&&!m.some(function(x){return x.id===l.itemId})){l.itemId=m[0].id;var g0=findItem(l.itemId);$('rU'+i).textContent=g0?g0.unit:'';recInfo()}
   sel.innerHTML=ingredientOptions(l.itemId,l.q);
   if(l.q)sel.setAttribute('size',Math.max(2,Math.min(5,sel.options.length)));else sel.removeAttribute('size');
   if(l.q&&!m.length)toast('No stock item matches “'+l.q+'”');
  };
  $('rI'+i).onchange=function(){l.itemId=this.value;var g=findItem(l.itemId);$('rU'+i).textContent=g?g.unit:'';recInfo()};
  $('rQ'+i).oninput=function(){l.qty=this.value;recInfo()};
 });
 $('modal').querySelectorAll('[data-rdel]').forEach(function(b){b.onclick=function(){d.recipe.splice(+b.dataset.rdel,1);renderEdit()}});
 if($('rAdd'))$('rAdd').onclick=function(){var c=ingCands()[0];d.recipe.push({itemId:c?c.id:'',qty:'',q:''});renderEdit()};
 if($('rM')){
  $('rM').oninput=function(){d.margin=this.value};
  $('rSug').onclick=function(){
   var c=recCost(d),m=num(d.margin);
   if(c<=0){toast('Add stock items that have a cost first');return}
   if(m<=0||m>=100){toast('Enter a margin between 1 and 99');return}
   d.price=r2(c/(1-m/100));$('iPrice').value=d.price;recInfo();
  };
 }
 recInfo();
 $('iCancel').onclick=closeModal;
 $('iSave').onclick=function(){
  var n=d.name.trim(),p=parseFloat(d.price);
  if(!n){toast('Enter a name');return}
  if(isNaN(p)||p<0){toast('Enter a valid price');return}
  var rec=d.recipe.filter(function(l){return num(l.qty)>0&&findItem(l.itemId)}).map(function(l){return {itemId:l.itemId,qty:num(l.qty)}});
  var f={name:n,price:Math.round(p*100)/100,cat:d.cat,kind:'sale',noSale:false,recipe:rec,track:false,unit:'pcs',stock:0,cost:0,menu:d.menu};
  if(d.id){var it=findItem(d.id);for(var k in f)it[k]=f[k]}else{f.id=uid();S.items.push(f)}
  var pid=d.id||f.id;if(d.photo)phPut(pid,d.photo);else if(d.photo==='')phDel(pid);
  lastItemCat=d.cat;saveUi();
  save();closeModal();refresh();
 };
 if($('iDel'))$('iDel').onclick=function(){
  var it=findItem(d.id);if(!it)return;
  ask('Delete "'+it.name+'"? Past invoices are not affected.','Delete',function(){S.items=S.items.filter(function(x){return x.id!==it.id});delete cart[it.id];phDel(it.id);cartOrder=cartOrder.filter(function(x){return x.id!==it.id});save();closeModal();refresh()},function(){editItem(it.id)});
 };
}

migrate();
if(!S.cats.length)S.cats=['Drinks','Cigarettes','Purchases'];
buildNumpad();
